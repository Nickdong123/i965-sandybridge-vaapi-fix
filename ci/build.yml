name: Build i965 Sandy Bridge VA-API Driver

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libva-dev libdrm-dev libx11-dev libgl1-mesa-dev vainfo

      - name: Build patched driver
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Verify driver with vainfo
        run: |
          LIBVA_DRIVER_NAME=i965 LIBVA_DRIVERS_PATH=./out vainfo || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: i965_drv_video-sandybridge-patched
          path: out/i965_drv_video.so

      - name: Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/i965_drv_video.so
